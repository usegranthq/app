services:
  app:
    container_name: ug_app
    image: ${DOCKER_REPOSITORY}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
    ports:
      - 3000:3000
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway

  cron:
    container_name: ug_cron
    image: alpine/curl
    volumes:
      - ./cron.sh:/cron.sh:ro
    command: /cron.sh
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - CRON_URL=http://app:3000/api/cron
    depends_on:
      - app
    restart: unless-stopped
