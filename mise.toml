[tools]
node = "22"
"npm:smee-client" = "latest"
"aqua:nektos/act" = "latest"

[env]
_.file = ".env"

[tasks.setup]
run = [
  "mise install",
  "npm install"
]

[tasks.db]
run = "npm run db"

[tasks.dev]
run = "npm run dev"

[tasks.build]
run = "npm run build"

[tasks.start]
run = "sh ./start.sh"

[tasks.studio]
run = "npm run studio"

[tasks.lint]
run = "npm run lint"

[tasks.format]
run = "npm run format"

[tasks.check]
run = [
  { tasks = ["lint", "format"] }
]

[tasks."e2e:sdk"]
run = "sh ./e2e/run.sh"

[tasks."shadcn:update"]
run = "sh ./scripts/shadcn-update.sh"
