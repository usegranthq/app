services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grant_hq
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # migrate:
  #   container_name: ug_migrate
  #   image: ${DOCKER_REPOSITORY}-migrate:${IMAGE_TAG:-latest}
  #   environment:
  #     DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: 'no'

  migrate:
    container_name: ug_migrate
    image: node:22-alpine
    restart: 'no'
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma:ro
      - ./package.json:/app/package.json:ro
      - ./migrate.sh:/app/migrate.sh:ro
    command: /migrate.sh
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
    depends_on:
      postgres:
        condition: service_healthy

  app:
    container_name: ug_app
    image: ${DOCKER_REPOSITORY}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway

  cron:
    container_name: ug_cron
    image: alpine/curl
    volumes:
      - ./cron.sh:/cron.sh:ro
    command: /cron.sh
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - CRON_URL=http://app:3000/api/cron
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
