services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ug_backend-pgdata:/var/lib/postgresql/data
    restart: always
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}

volumes:
  ug_backend-pgdata:
