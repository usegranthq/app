services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    container_name: ug_migrate
    image: node:22-alpine
    restart: 'no'
    working_dir: /app
    volumes:
      - ./prisma:/app/prisma:ro
      - ./package.json:/app/package.json:ro
      - ./docker/migrate.sh:/app/migrate.sh:ro
    command: sh /app/migrate.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    container_name: ug_app
    image: ${DOCKER_REPOSITORY}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway

  cron:
    container_name: ug_cron
    image: alpine/curl
    working_dir: /app
    volumes:
      - ./docker/cron.sh:/app/cron.sh:ro
    command: ['/bin/sh', '/app/cron.sh']
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - CRON_URL=http://app:3000/api/cron
    depends_on:
      - app
    restart: always

volumes:
  postgres_data:
