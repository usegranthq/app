services:
  postgres:
    container_name: postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grant_hq
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - 6379:6379
    restart: always

  migrate:
    container_name: ug_migrate
    build:
      context: .
      target: install
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'migrate']
    restart: 'no'

  app:
    container_name: ug_app
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grant_hq
      REDIS_URL: redis://redis:6379
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway

  crontab:
    container_name: ug_cron
    build:
      context: .
      dockerfile: Dockerfile.cron
    environment:
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
