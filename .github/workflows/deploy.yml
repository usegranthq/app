name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    environment:
      name: production
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup docker
        uses: docker/setup-docker-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write environment variables
        uses: sibiraj-s/action-toenv@v1
        with:
          env: |
            DOCKER_REPOSITORY=${{ secrets.DOCKER_REPOSITORY }}
            IMAGE_TAG=${{ github.sha }}
            SITE_URL=${{ vars.SITE_URL }}
            INVITE_TOKEN=${{ secrets.INVITE_TOKEN }}
            JWT_SIGNING_SECRET=${{ secrets.JWT_SIGNING_SECRET }}
            TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            OAUTH_GITHUB_APP_CLIENT_ID=${{ secrets.OAUTH_GITHUB_APP_CLIENT_ID }}
            OAUTH_GITHUB_APP_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_APP_CLIENT_SECRET }}
            OAUTH_GOOGLE_APP_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_APP_CLIENT_ID }}
            OAUTH_GOOGLE_APP_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_APP_CLIENT_SECRET }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            PROVIDER_DOMAIN=${{ vars.PROVIDER_DOMAIN }}
            NODEMAILER_SMTP_URL=${{ vars.NODEMAILER_SMTP_URL }}
            EMAIL_FROM=${{ vars.EMAIL_FROM }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
            STATE_HMAC_SECRET_KEY=${{ secrets.STATE_HMAC_SECRET_KEY }}
            POLAR_ACCESS_TOKEN=${{ secrets.POLAR_ACCESS_TOKEN }}
            POLAR_WEBHOOK_SECRET=${{ secrets.POLAR_WEBHOOK_SECRET }}
            POLAR_PRO_PLAN_PRODUCT_ID=${{ secrets.POLAR_PRO_PLAN_PRODUCT_ID }}
            POLAR_ULTIMATE_PLAN_PRODUCT_ID=${{ secrets.POLAR_ULTIMATE_PLAN_PRODUCT_ID }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.migrate
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REPOSITORY }}-migrate:${{ github.sha }}
            ${{ secrets.DOCKER_REPOSITORY }}-migrate:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKER_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push cron image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cron
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_REPOSITORY }}-cron:${{ github.sha }}
            ${{ secrets.DOCKER_REPOSITORY }}-cron:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.HETZNER_HOST_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker compose --file compose.yml pull
          docker compose --file compose.yml up -d --remove-orphans
          docker system prune -f
        env:
          DOCKER_HOST: ssh://${{ secrets.REMOTE_DOCKER_HOST }}
          COMPOSE_BAKE: true

      - name: Remove environment variables file
        run: rm -f .env
