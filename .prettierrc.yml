singleQuote: true
trailingComma: 'all'
printWidth: 120
plugins:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss

tailwindStylesheet: ./src/app/globals.css

overrides:
  - files: '**/*.md'
    options:
      printWidth: 100
      proseWrap: 'always'

importOrder:
  - <BUILTIN_MODULES>
  - '^react$'
  - '^next(.*)$'
  - <THIRD_PARTY_MODULES>
  - ''
  - '@/shadcn/(.*)$'
  - ''
  - ^@/types/(.*)$
  - ''
  - ^@/constants/(.*)$
  - ^@/utils/(.*)$
  - ^@/schema/(.*)$
  - ^@/lib/(.*)$
  - ^@/data/(.*)$
  - ^@/actions/(.*)$
  - '^@/(.*)$'
  - ''
  - '^../(.*)$'
  - '^./(.*)$'
  - '^[./]'
